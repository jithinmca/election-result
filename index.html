<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECI Direct Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="summary-bar" style="justify-content: center; align-items: center; padding: 6px 8px;">
        <div class="state-tabs" style="display: flex; align-items: center; gap: 4px; margin-right: 8px;">
            <button class="state-tab active" id="tab-S11" onclick="changeState('S11')">Kerala (140)</button>
            <button class="state-tab" id="tab-S22" onclick="changeState('S22')">Tamil Nadu (234)</button>
            <span style="font-size: 10px; color: #94A3B8; margin-left: 4px;">|</span>
        </div>
        <div id="dynamic-summary-cards" style="display: flex; gap: 8px; flex-wrap: wrap;">
            <!-- Generated by script.js based on state -->
        </div>
    </header>

    <main class="dashboard-container">
        <div id="loader" class="loader">
            <p>Fetching directly from ECI Servers...</p>
            <div style="font-size: 10px; margin-top: 10px; color: #94a3b8;"><span id="fetch-progress">0</span> / <span id="fetch-total">140</span></div>
        </div>
        <div id="dashboard" style="display: none;">
            <div id="districts-container"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
