<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECI Direct Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="summary-bar" style="justify-content: space-between; align-items: center; padding: 6px 8px;">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <div class="state-tabs" style="display: flex; align-items: center; gap: 4px; margin-right: 4px;">
                <button class="state-tab active" id="tab-S11" onclick="changeState('S11')">Kerala</button>
                <button class="state-tab" id="tab-S22" onclick="changeState('S22')">Tamil Nadu</button>
            </div>
            <div style="position: relative; display: flex; gap: 6px;">
                <select id="sort-select" onchange="handleSortChange(event)" style="padding: 4px 6px; border-radius: 4px; border: 1px solid #cbd5e1; outline: none; font-size: 11px; font-family: 'Inter', sans-serif;">
                    <option value="district">By District</option>
                    <option value="margin_asc">Margin: Tightest</option>
                    <option value="margin_desc">Margin: Highest</option>
                </select>
                <div style="position: relative;">
                    <input type="text" id="global-search" oninput="handleSearch(event)" placeholder="Search candidate, district..." style="padding: 4px 8px; border-radius: 4px; border: 1px solid #cbd5e1; outline: none; font-size: 11px; width: 160px; font-family: 'Inter', sans-serif;">
                    <span id="sync-indicator" style="display: none; position: absolute; right: 6px; top: 4px; font-size: 11px; font-weight: bold; color: #10B981;">↻</span>
                </div>
            </div>
        </div>
        <div id="dynamic-summary-cards" style="display: flex; gap: 6px; flex-wrap: wrap;">
            <!-- Generated by script.js based on state -->
        </div>
    </header>

    <main class="dashboard-container">
        <div id="loader" class="loader">
            <p>Fetching directly from ECI Servers...</p>
            <div style="font-size: 10px; margin-top: 10px; color: #94a3b8;"><span id="fetch-progress">0</span> / <span id="fetch-total">140</span></div>
        </div>
        <div id="dashboard" style="display: none;">
            <div id="districts-container"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
